<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b2442">
<title>MORIFUT | セルフ受付</title>
<link rel="stylesheet" href="style.css?v=12">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root{--r-navy:#0b2442;--r-blue:#245b91;--r-line:#d9e2ee;--r-muted:#53667b;--r-green:#087f5b}
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;background:#f3f6fa;color:#132238;overflow:hidden}
  body{min-height:100svh}
  .r-app{height:100dvh;min-height:100svh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
  .r-header{position:relative!important;inset:auto!important;z-index:901;width:100%;height:54px;flex:0 0 54px;background:var(--r-navy);color:#fff;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .r-brand{font-size:18px;font-weight:950;letter-spacing:1.2px}.r-brand span{color:#a8cff5}
  .r-counter-panel{flex:0 0 auto;background:#f0f7ff;border:1px solid #c9dced;border-radius:10px;padding:9px 11px;color:#173f70}
  .r-counter-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .r-counter-total{font-size:18px;font-weight:950;color:var(--r-navy);white-space:nowrap}
  .r-counter-total strong{color:#047857}
  .r-counter-logout{flex:none;border:1px solid #c8d7e7;border-radius:6px;padding:4px 7px;background:#fff;color:#315f91;font-size:10px;font-weight:850;cursor:pointer}
  .r-counter-events{display:grid;gap:3px;margin-top:5px}
  .r-counter-event{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:#334b66}
  .r-counter-event span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r-counter-event strong{white-space:nowrap;color:#047857}
  .r-counter-hint{margin-top:4px;font-size:10px;line-height:1.35;color:#53667b}
  .r-counter-login{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;line-height:1.4;color:#334b66}
  .r-counter-login button{flex:none;border:0;border-radius:7px;padding:7px 9px;background:#173f70;color:#fff;font-size:11px;font-weight:900;cursor:pointer}
  .r-main{width:min(100% - 16px,560px);margin:0 auto;padding:8px 0;flex:1;min-height:0;overflow:hidden}
  .r-screen{height:100%;min-height:0}
  .r-hidden{display:none!important}
  .r-card{height:100%;min-height:0;background:#fff;border:1px solid var(--r-line);border-radius:16px;padding:clamp(12px,2.3vh,22px);box-shadow:0 8px 26px rgba(15,41,70,.08);overflow:hidden}
  .r-home{display:grid;place-items:center}
  .r-home-card{height:auto;max-height:100%;width:100%;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,1.8vh,16px)}
  .r-kicker{font-size:11px;font-weight:950;letter-spacing:1.8px;color:var(--r-blue);margin:0}
  .r-title{font-size:clamp(25px,7vw,34px);line-height:1.15;font-weight:950;color:var(--r-navy);margin:0}
  .r-start-button{width:100%;min-height:clamp(88px,15vh,132px);border:0;border-radius:18px;background:linear-gradient(135deg,#315f91,#0b2442);color:#fff;box-shadow:0 10px 24px rgba(11,36,66,.19);font-size:clamp(34px,10vw,48px);font-weight:950;letter-spacing:.06em;cursor:pointer;touch-action:manipulation}
  .r-start-button:disabled{opacity:.65}
  .r-save-guide{display:grid;gap:7px;text-align:left;background:#f4f7fb;border:1px solid var(--r-line);border-radius:11px;padding:10px 12px;color:#334b66;font-size:clamp(11px,3.1vw,13px);line-height:1.4}
  .r-save-guide strong{color:#173f70}
  .r-home-message:empty{display:none}
  .r-page-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 7px}
  .r-page-head .r-title{font-size:clamp(21px,6vw,28px)}
  .r-btn{min-height:42px;border:0;border-radius:10px;padding:9px 13px;font-size:15px;font-weight:900;cursor:pointer;touch-action:manipulation}
  .r-btn-primary{background:linear-gradient(135deg,#315f91,#173f70);color:#fff}
  .r-btn-secondary{background:#e8eff7;color:#163b66;border:1px solid #c8d7e7}
  .r-btn:disabled{opacity:.55;cursor:wait}
  .r-selected-event{font-size:13px;font-weight:850;color:#173f70;background:#edf4fb;border-radius:9px;padding:7px 10px;margin:0 0 6px}
  .r-camera-card{display:flex;flex-direction:column;padding:10px;gap:4px}
  #qr-reader{width:100%;height:min(43vh,360px);min-height:180px;margin:0 auto;overflow:hidden;border-radius:12px;background:#101820}
  #qr-reader video{width:100%!important;height:min(43vh,360px)!important;max-height:none!important;object-fit:cover;border-radius:12px}
  #qr-reader img{max-width:100%}
  #qr-reader__dashboard_section_csr button,#qr-reader__dashboard_section_swaplink{display:none!important}
  .r-camera-status{font-size:13px;font-weight:800;color:var(--r-muted);text-align:center;min-height:20px;margin:3px 0}
  .r-alert{padding:9px 11px;border-radius:9px;background:#fff7e6;border:1px solid #f4d38e;color:#734d08;font-size:13px;font-weight:750;line-height:1.4;margin:5px 0}
  .r-alert.r-error{background:#fff1f1;border-color:#fecaca;color:#991b1b}
  .r-manual-toggle{align-self:center;min-height:34px;padding:6px 10px;font-size:13px}
  .r-manual-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px}
  .r-input{width:100%;min-width:0;min-height:42px;border:1px solid #b9cadb;border-radius:9px;background:#fff;padding:8px 10px;font-size:17px;color:#132238;text-transform:uppercase}
  .r-done-card{display:flex;flex-direction:column;gap:7px;padding:clamp(10px,1.8vh,16px)}
  .r-success{flex:0 0 auto;background:#ecfdf5;border:1px solid #86efac;color:#047857;border-radius:12px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .r-success-title{font-size:clamp(22px,6vw,30px);font-weight:950;line-height:1.15}
  .r-success-meta{font-size:12px;font-weight:800;text-align:right}
  .r-result-event{font-size:12px;font-weight:800;color:var(--r-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r-people-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;min-height:0}
  .r-person{min-width:0;background:#f8fafc;border:1px solid var(--r-line);border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;justify-content:center;gap:5px}
  .r-person-name{font-size:clamp(12px,3.6vw,15px);font-weight:900;color:var(--r-navy);line-height:1.2;overflow-wrap:anywhere}
  .r-person-meta{display:flex;align-items:center;justify-content:space-between;gap:4px}
  .r-bib-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;white-space:nowrap}
  .r-bib-dot{width:12px;height:12px;flex:0 0 12px;border:1px solid rgba(0,0,0,.18);border-radius:50%}
  .r-fee{font-size:clamp(12px,3.5vw,15px);font-weight:950;color:#315f91;white-space:nowrap}
  .r-total{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--r-line);padding-top:6px;font-size:13px;font-weight:800;color:#53667b}
  .r-total strong{font-size:clamp(20px,5.5vw,26px);color:var(--r-navy)}
  .r-note{flex:0 0 auto;background:#f4f7fb;border-left:4px solid #315f91;border-radius:8px;padding:7px 9px;min-height:34px;max-height:4.1em;overflow:hidden;font-size:12px;line-height:1.35;color:#263b52;overflow-wrap:anywhere}
  .r-note-label{font-size:10px;font-weight:950;color:#315f91;margin-right:5px}
  .r-after-qr{flex:0 0 auto;min-height:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;background:#f1f8f5;border:1px solid #c3e7d4;border-radius:10px}
  .r-after-qr-copy{min-width:0;display:flex;flex-direction:column;gap:4px;color:#24533b}
  .r-after-qr-title{font-size:14px;font-weight:950;color:#087f5b}
  .r-after-qr-copy span{font-size:11px;line-height:1.35}
  .r-after-qr img{display:block;flex:0 0 clamp(128px,40vw,160px);width:clamp(128px,40vw,160px);height:clamp(128px,40vw,160px);max-width:48%;object-fit:contain;border-radius:8px;background:#fff}
  .r-next{flex:0 0 auto;width:100%;min-height:42px}
  #r-scan-message:empty{display:none}
  @media(max-height:700px){
    .r-header{height:48px;flex-basis:48px}
    .r-main{padding:5px 0}
    .r-card{padding:10px}
    .r-start-button{min-height:76px}
    #qr-reader,#qr-reader video{height:min(38vh,300px)!important;min-height:150px}
    .r-done-card{gap:5px}
    .r-person{padding:5px 7px;gap:3px}
    .r-after-qr img{flex-basis:clamp(110px,34vw,136px);width:clamp(110px,34vw,136px);height:clamp(110px,34vw,136px)}
  }
  @media(max-width:360px){.r-main{width:calc(100% - 12px)}.r-person{padding:6px}.r-bib-chip{font-size:10px}}
</style>
</head>
<body>
<div class="r-app">
  <header class="r-header"><div class="r-brand">MORI<span>FUT</span></div></header>
  <main class="r-main">
    <section id="r-home" class="r-screen r-home">
      <div class="r-card r-home-card">
        <p class="r-kicker">MORIFUT CHECK-IN</p>
        <h1 class="r-title">当日の受付</h1>
        <div id="r-count-home" class="r-counter-panel" aria-live="polite"></div>
        <button id="r-start" class="r-start-button" type="button" onclick="showReceptionEvents()">受付する</button>
        <div class="r-save-guide">
          <div><strong>参加者：</strong>予約完了画面の「会場受付用QRコード」を保存してください。</div>
          <div><strong>運営：</strong>必要な予約QRは運営画面から保存しておいてください。</div>
        </div>
        <div id="r-home-message" class="r-home-message" aria-live="polite"></div>
      </div>
    </section>

    <section id="r-scan" class="r-screen r-hidden">
      <div class="r-card r-camera-card">
        <div class="r-page-head">
          <h1 class="r-title">QR受付</h1>
          <button class="r-btn r-btn-secondary" type="button" onclick="returnReceptionHome()">戻る</button>
        </div>
        <div id="r-selected-event" class="r-selected-event"></div>
        <div id="r-count-scan" class="r-counter-panel" aria-live="polite"></div>
        <div id="qr-reader"></div>
        <p id="r-camera-status" class="r-camera-status" role="status" aria-live="polite">カメラを準備しています…</p>
        <button id="r-camera-retry" class="r-btn r-btn-secondary r-hidden" type="button" onclick="startReceptionScanner()">カメラを再起動</button>
        <button id="r-manual-toggle" class="r-btn r-btn-secondary r-manual-toggle" type="button" onclick="toggleManualEntry()">予約番号で受付</button>
        <div id="r-manual-form" class="r-manual-form r-hidden">
          <input id="r-code" class="r-input" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="MF-ABCD-1234WXYZ" aria-label="予約番号">
          <button class="r-btn r-btn-primary" type="button" onclick="lookupReservationCodeByInput()">確認</button>
        </div>
        <div id="r-scan-message" aria-live="polite"></div>
      </div>
    </section>

    <section id="r-done" class="r-screen r-hidden"></section>
  </main>
</div>
<script src="common.js?v=4"></script>
<script src="assets/js/html5-qrcode.min.js?v=1"></script>
<script src="reception.js?v=15"></script>
</body>
</html>
